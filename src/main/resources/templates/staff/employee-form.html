<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Редактирование сотрудника' : 'Новый сотрудник')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(${isEdit} ? 'Редактирование сотрудника' : 'Новый сотрудник', ~{::main})}">
    <main>
        <div class="mb-3">
            <a th:href="@{/staff}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Назад к персоналу
            </a>
        </div>

        <div class="card" style="max-width: 640px;">
            <div class="card-header" th:text="${isEdit} ? 'Данные сотрудника' : 'Добавление сотрудника'">Сотрудник</div>
            <div class="card-body">
                <form th:action="@{/staff/employees}" th:object="${form}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">ФИО сотрудника *</label>
                        <input type="text" class="form-control" th:field="*{fullName}" required>
                        <div class="text-danger small" th:errors="*{fullName}"></div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Должность *</label>
                            <input type="text" class="form-control" th:field="*{position}" placeholder="Повар, Кассир..." required>
                            <div class="text-danger small" th:errors="*{position}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Телефон</label>
                            <input type="text" class="form-control" th:field="*{phone}" placeholder="+996 555 123 456">
                            <div class="text-danger small" th:errors="*{phone}"></div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Часовая ставка (сом)</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{hourlyRate}">
                            <div class="text-danger small" th:errors="*{hourlyRate}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Дата приёма</label>
                            <input type="date" class="form-control" th:field="*{hireDate}">
                            <div class="text-danger small" th:errors="*{hireDate}"></div>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="empActive">
                        <label class="form-check-label" for="empActive">Активен (доступен в графиках смен)</label>
                    </div>

                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-check-lg me-1"></i>Сохранить
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
