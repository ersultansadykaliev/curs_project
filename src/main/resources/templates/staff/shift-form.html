<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Редактирование смены' : 'Новая смена')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(${isEdit} ? 'Редактирование смены' : 'Новая смена', ~{::main})}">
    <main>
        <div class="mb-3">
            <a th:href="@{/staff}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Назад к персоналу
            </a>
        </div>

        <div class="card" style="max-width: 600px;">
            <div class="card-header" th:text="${isEdit} ? 'Изменить смену' : 'Добавить рабочую смену'">Смена</div>
            <div class="card-body">
                <form th:action="@{/staff/shifts}" th:object="${form}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Сотрудник *</label>
                        <select class="form-select" th:field="*{employeeId}" required>
                            <option value="">— Выберите сотрудника —</option>
                            <option th:each="e : ${employees}" th:value="${e.id}"
                                    th:text="${e.fullName} + ' (' + ${e.position} + ')'">Сотрудник</option>
                        </select>
                        <div class="text-danger small" th:errors="*{employeeId}"></div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Дата смены *</label>
                            <input type="date" class="form-control" th:field="*{shiftDate}" required>
                            <div class="text-danger small" th:errors="*{shiftDate}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Начало *</label>
                            <input type="time" class="form-control" th:field="*{startTime}" required>
                            <div class="text-danger small" th:errors="*{startTime}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Окончание *</label>
                            <input type="time" class="form-control" th:field="*{endTime}" required>
                            <div class="text-danger small" th:errors="*{endTime}"></div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Фактически отработано часов</label>
                        <input type="number" step="0.25" min="0" max="24" class="form-control" th:field="*{workedHours}"
                               placeholder="Если пусто — считается по длительности смены">
                        <div class="text-danger small" th:errors="*{workedHours}"></div>
                    </div>

                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-check-lg me-1"></i>Сохранить смену
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
