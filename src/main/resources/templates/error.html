<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ошибка')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell('Ошибка', ~{::main})}">
    <main>
        <div class="card">
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-octagon text-danger display-4 mb-3 d-block"></i>
                <h2 class="h4 fw-bold" th:text="${errorTitle ?: 'Произошла ошибка'}">Ошибка</h2>
                <p class="text-muted mb-4" th:text="${errorMessage ?: 'Не удалось выполнить запрос.'}">Сообщение об ошибке</p>
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i>На главную панель
                </a>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
