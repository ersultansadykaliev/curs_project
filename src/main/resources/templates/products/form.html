<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Редактирование товара' : 'Новый товар')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(${isEdit} ? 'Редактирование товара' : 'Новый товар', ~{::main})}">
    <main>
        <div class="mb-3">
            <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>К списку товаров
            </a>
        </div>

        <div class="card" style="max-width: 640px;">
            <div class="card-header" th:text="${isEdit} ? 'Изменить товар' : 'Добавить товар в ассортимент'">Товар</div>
            <div class="card-body">
                <form th:action="@{/products}" th:object="${form}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Название товара *</label>
                        <input type="text" class="form-control" th:field="*{name}" placeholder="Например: Бургер Классик" required>
                        <div class="text-danger small" th:errors="*{name}"></div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Категория</label>
                            <input type="text" class="form-control" th:field="*{category}" placeholder="Бургеры, Напитки, Комбо...">
                            <div class="text-danger small" th:errors="*{category}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Цена продажи (сом) *</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{price}" required>
                            <div class="text-danger small" th:errors="*{price}"></div>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="productActive">
                        <label class="form-check-label" for="productActive">
                            Активен (доступен при создании новых заказов)
                        </label>
                    </div>

                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-check-lg me-1"></i>Сохранить
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
