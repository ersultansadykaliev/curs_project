<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Редактирование ингредиента' : 'Новый ингредиент')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(${isEdit} ? 'Редактирование ингредиента' : 'Новый ингредиент', ~{::main})}">
    <main>
        <div class="mb-3">
            <a th:href="@{/ingredients}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>К списку ингредиентов
            </a>
        </div>

        <div class="card" style="max-width: 580px;">
            <div class="card-header" th:text="${isEdit} ? 'Изменить ингредиент' : 'Добавить ингредиент'">Ингредиент</div>
            <div class="card-body">
                <form th:action="@{/ingredients}" th:object="${form}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Название ингредиента *</label>
                        <input type="text" class="form-control" th:field="*{name}" placeholder="Например: Говяжья котлета" required>
                        <div class="text-danger small" th:errors="*{name}"></div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-5">
                            <label class="form-label">Единица измерения *</label>
                            <input type="text" class="form-control" th:field="*{unit}" placeholder="шт, кг, л" required>
                            <div class="text-danger small" th:errors="*{unit}"></div>
                        </div>
                        <div class="col-md-7">
                            <label class="form-label">Стоимость единицы (сом) *</label>
                            <input type="number" step="0.0001" min="0.0001" class="form-control" th:field="*{unitCost}" required>
                            <div class="text-danger small" th:errors="*{unitCost}"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-check-lg me-1"></i>Сохранить
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
