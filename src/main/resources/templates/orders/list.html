<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Заказы')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell('Модуль заказов', ~{::main})}">
    <main>
        <div class="card mb-4">
            <div class="card-body">
                <form method="get" th:action="@{/orders}" class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small text-muted mb-1">Поиск (чек или комментарий)</label>
                        <input type="text" name="q" class="form-control form-control-sm"
                               th:value="${q}" placeholder="Например: D-2611 или На вынос">
                    </div>
                    <div class="col-sm-6 col-md-2">
                        <label class="form-label small text-muted mb-1">Дата с</label>
                        <input type="date" name="from" class="form-control form-control-sm" th:value="${period.from()}">
                    </div>
                    <div class="col-sm-6 col-md-2">
                        <label class="form-label small text-muted mb-1">Дата по</label>
                        <input type="date" name="to" class="form-control form-control-sm" th:value="${period.to()}">
                    </div>
                    <div class="col-md-auto">
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="bi bi-search me-1"></i>Найти
                        </button>
                        <a th:href="@{/orders}" class="btn btn-outline-secondary btn-sm">Сбросить</a>
                    </div>
                    <div class="col-md text-md-end">
                        <a th:href="@{/orders/new}" class="btn btn-danger btn-sm">
                            <i class="bi bi-plus-lg me-1"></i>Добавить заказ
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <div class="small text-muted">
                Найдено заказов: <strong th:text="${orders.totalElements}">0</strong>
            </div>
            <div class="badge bg-light text-dark border px-3 py-2 fs-6">
                Общая сумма найденных заказов:
                <strong class="text-primary ms-1" th:text="${@fmt.money(totalSum)}">0,00 сом</strong>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>ID / Чек</th>
                            <th>Дата</th>
                            <th>Время</th>
                            <th>Состав заказа</th>
                            <th class="text-end">Сумма</th>
                            <th class="text-end">Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${orders.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-4">
                                Заказов по заданному фильтру не найдено.
                            </td>
                        </tr>
                        <tr th:each="o : ${orders.content}">
                            <td>
                                <a th:href="@{/orders/{id}(id=${o.id()})}" class="fw-semibold text-decoration-none"
                                   th:text="${o.orderNumber()}">№1</a>
                                <div class="small text-muted" th:text="'ID #' + ${o.id()}">#1</div>
                            </td>
                            <td th:text="${#temporals.format(o.date(), 'dd.MM.yyyy')}">01.01.2026</td>
                            <td th:text="${#temporals.format(o.time(), 'HH:mm')}">12:00</td>
                            <td>
                                <div th:text="${o.itemsSummary()}">Бургер × 1</div>
                                <div th:if="${o.comment() != null}" class="small text-muted" th:text="${o.comment()}"></div>
                            </td>
                            <td class="text-end fw-semibold" th:text="${@fmt.money(o.total())}">0 сом</td>
                            <td class="text-end text-nowrap">
                                <a th:href="@{/orders/{id}(id=${o.id()})}" class="btn btn-outline-secondary btn-sm" title="Подробнее">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/orders/{id}/edit(id=${o.id()})}" class="btn btn-outline-primary btn-sm" title="Редактировать">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/orders/{id}/delete(id=${o.id()})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Удалить этот заказ?')">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" title="Удалить">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Пагинация -->
            <div th:if="${orders.totalPages > 1}" class="card-footer bg-white d-flex justify-content-between align-items-center">
                <div class="small text-muted">
                    Страница <span th:text="${orders.number + 1}">1</span> из <span th:text="${orders.totalPages}">1</span>
                </div>
                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${orders.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/orders(from=${period.from()}, to=${period.to()}, q=${q}, page=${orders.number - 1})}">Назад</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                            th:if="${i >= orders.number - 2 and i <= orders.number + 2}"
                            th:classappend="${i == orders.number} ? 'active'">
                            <a class="page-link"
                               th:href="@{/orders(from=${period.from()}, to=${period.to()}, q=${q}, page=${i})}"
                               th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${orders.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/orders(from=${period.from()}, to=${period.to()}, q=${q}, page=${orders.number + 1})}">Вперёд</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
