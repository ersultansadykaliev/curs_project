<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Детали заказа')}"></head>
<body>
<div th:replace="~{fragments/layout :: shell('Подробности заказа №' + ${order.orderNumber}, ~{::main})}">
    <main>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a th:href="@{/orders}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>К списку заказов
            </a>
            <div class="d-flex gap-2">
                <a th:href="@{/orders/{id}/edit(id=${order.id})}" class="btn btn-primary btn-sm">
                    <i class="bi bi-pencil me-1"></i>Редактировать
                </a>
                <form th:action="@{/orders/{id}/delete(id=${order.id})}" method="post"
                      onsubmit="return confirm('Удалить этот заказ?')">
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-trash me-1"></i>Удалить
                    </button>
                </form>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="kpi-card">
                    <div class="kpi-label">Номер чека / ID</div>
                    <div class="kpi-value" th:text="${order.orderNumber}">D-001</div>
                    <div class="kpi-sub" th:text="'Системный ID: #' + ${order.id}">ID</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="kpi-card">
                    <div class="kpi-label">Дата и время</div>
                    <div class="kpi-value" th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy')}">01.01.2026</div>
                    <div class="kpi-sub" th:text="'Время: ' + ${#temporals.format(order.orderTime, 'HH:mm')}">12:00</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="kpi-card">
                    <div class="kpi-label">Общая сумма</div>
                    <div class="kpi-value text-primary" th:text="${@fmt.money(order.totalAmount)}">0 сом</div>
                    <div class="kpi-sub" th:text="'Единиц товара: ' + ${order.itemsCount}">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="kpi-card">
                    <div class="kpi-label">Комментарий</div>
                    <div class="fw-medium mt-1" th:text="${order.comment ?: '—'}">—</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Состав заказа</div>
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Товар</th>
                        <th class="text-end">Цена продажи</th>
                        <th class="text-end">Количество</th>
                        <th class="text-end">Сумма</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(order.items)}">
                        <td colspan="4" class="text-center text-muted py-4">
                            Состав заказа не указан (сумма введена вручную или импортирована из кассы).
                        </td>
                    </tr>
                    <tr th:each="item : ${order.items}">
                        <td class="fw-medium" th:text="${item.product.name}">Бургер</td>
                        <td class="text-end" th:text="${@fmt.money(item.unitPrice)}">0 сом</td>
                        <td class="text-end" th:text="${item.quantity} + ' шт.'">1</td>
                        <td class="text-end fw-semibold" th:text="${@fmt.money(item.lineTotal)}">0 сом</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
