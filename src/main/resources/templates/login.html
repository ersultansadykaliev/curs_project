<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — CRM Analytics for Fast Food</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">

<div class="login-card">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger bg-opacity-10 text-danger mb-3"
             style="width: 56px; height: 56px;">
            <i class="bi bi-fire fs-2"></i>
        </div>
        <h1 class="h4 fw-bold mb-1">CRM Analytics for Fast Food</h1>
        <p class="text-muted small mb-0">Система управления и математической аналитики предприятия быстрого питания</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 small">
        <i class="bi bi-exclamation-circle me-1"></i>Неверный логин или пароль, либо учётная запись отключена.
    </div>
    <div th:if="${param.logout}" class="alert alert-info py-2 small">
        <i class="bi bi-info-circle me-1"></i>Вы вышли из системы.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label fw-medium">Логин</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Введите логин" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label fw-medium">Пароль</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Введите пароль" required>
            </div>
        </div>
        <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>Войти в систему
        </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center small text-muted">
        Для первого входа по умолчанию: <code>admin</code> / <code>admin123</code>
    </div>
</div>

</body>
</html>
