# ======================================================================
#  Встроенная база H2 (файл ./data/fastfood_crm.mv.db) — запуск без установки MySQL.
#  Режим MODE=MySQL делает поведение SQL максимально похожим на MySQL.
# ======================================================================
spring.datasource.url=jdbc:h2:file:./data/fastfood_crm;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
