# ======================================================================
#  CRM Analytics for Fast Food — общие настройки
# ======================================================================
spring.application.name=fastfood-crm
server.port=${PORT:8080}

# Профиль по умолчанию — MySQL. Для запуска без MySQL: --spring.profiles.active=h2
spring.profiles.default=mysql

# JPA / Hibernate
# update — Hibernate создаёт недостающие таблицы и колонки по Entity-классам.
# Эталонный SQL-скрипт для MySQL лежит в папке sql/ (schema.sql).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
# Загрузка связанных коллекций пачками — защита от проблемы N+1 запросов
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Thymeleaf
spring.thymeleaf.cache=false
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Загрузка CSV-файлов
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Сессия пользователя — 8 часов
server.servlet.session.timeout=8h

# Пользователь-администратор, создаётся при первом запуске (пароль обязательно смените в «Настройках»)
app.admin.username=admin
app.admin.password=admin123
# Загружать демонстрационные данные, если база пустая
app.demo.load-on-empty=true

logging.level.org.hibernate.SQL=WARN
