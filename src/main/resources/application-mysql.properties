# ======================================================================
#  Подключение к MySQL (профиль по умолчанию)
#  Параметры можно переопределить переменными окружения DB_URL, DB_USER, DB_PASSWORD
# ======================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fastfood_crm?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
